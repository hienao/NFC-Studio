name: Bug report / 问题反馈
description: Report an app or NFC tag problem / 报告应用或 NFC 标签问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve NFC Studio. English and Chinese are welcome.
        Check the [FAQ](https://github.com/hienao/NFC-Studio/blob/main/docs/faq.md) / [常见问题](https://github.com/hienao/NFC-Studio/blob/main/docs/zh-CN/faq.md) and existing issues first.
        This report is public. Remove tag UIDs, passwords, authentication keys, and personal NDEF content. Never attach a backup.
        本反馈公开可见，请移除UID、密码、认证密钥和 NDEF 个人内容，勿上传备份。敏感问题请联系 shiwentao666@gmail.com。
  - type: input
    id: app_version
    attributes:
      label: App version / 应用版本
      placeholder: "Example: 1.1.13"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Pro status / Pro 状态
      options:
        - Free
        - Pro trial / Pro 试用
        - Pro lifetime / Pro 永久买断
        - Pro annual / Pro 年度订阅
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device / Android 版本与设备
      placeholder: "Example: Android 15, Pixel 8"
    validations:
      required: true
  - type: input
    id: tag_type
    attributes:
      label: Tag type or technology / 标签类型或技术
      description: Use the reported technology, not the UID / 填写技术类型，不要填写 UID
      placeholder: "Example: NTAG213 / NfcA / NDEF; unknown if unavailable"
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Operation and tag state / 操作与标签状态
      description: Read, write, QR import, batch, purchase; writable/locked if known. No content or credentials. / 读取、写入、二维码、批量或购买；注明可写/锁定状态，不填写内容或凭据。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and exact error / 实际结果与准确错误
      description: Sanitized screenshots or short logs are optional / 可附脱敏截图或简短日志
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I removed sensitive data and did not attach a backup / 已移除敏感信息，未上传备份
          required: true
